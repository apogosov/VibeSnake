<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="app">
    <h1>Snake</h1>
    <div class="hud" aria-live="polite">
      <p>Score: <span id="score">0</span></p>
      <p>High score: <span id="highScore">0</span></p>
    </div>

    <canvas id="board" width="400" height="400" role="img" aria-label="Snake game board"></canvas>

    <div class="controls">
      <div class="controls-row">
        <label class="level-control" for="levelSelect">
          Level:
          <select id="levelSelect">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <button id="startBtn" type="button">Start / Restart</button>
      </div>
      <div class="options-group">
        <label class="checkbox-control" for="speedCheck">
          <input type="checkbox" id="speedCheck" checked>
          Speed up every 5 pts
        </label>
        <label class="checkbox-control" for="botCheck">
          <input type="checkbox" id="botCheck" checked>
          Enable Bot Opponent
        </label>
      </div>
      <p>Use arrow keys or WASD. On mobile, swipe to change direction.</p>
      <p id="status">Press Start to play.</p>
    </div>
  </main>

  <script src="game.js"></script>
</body>

</html>
